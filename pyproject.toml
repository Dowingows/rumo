[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rumo"
version = "0.1.0"
description = "CLI inteligente para sugestão, execução e diagnóstico de comandos de terminal"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
rumo = "rumo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rumo"]
