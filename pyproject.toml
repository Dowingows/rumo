[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rumo"
version = "0.1.0"
description = "CLI inteligente para sugestão, execução e diagnóstico de comandos de terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "ai", "terminal", "llm", "shell"]
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/Dowingows/rumo"

[project.scripts]
rumo = "rumo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rumo"]
